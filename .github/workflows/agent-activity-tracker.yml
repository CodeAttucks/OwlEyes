name: Agent Activity Tracker

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 09:00 UTC
  workflow_run:
    workflows: ["Copilot coding agent"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  generate-activity-report:
    runs-on: ubuntu-latest

    steps:
      - name: Generate agent activity report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          SINCE=$(date -d '7 days ago' --utc +%Y-%m-%dT%H:%M:%SZ)
          TODAY=$(date --utc +%Y-%m-%d)

          # --- Collect agent workflow runs ---
          gh run list \
            --repo "$REPO" \
            --workflow "Copilot coding agent" \
            --limit 50 \
            --json databaseId,displayTitle,status,conclusion,createdAt,url \
            > /tmp/runs_raw.json 2>/dev/null || echo "[]" > /tmp/runs_raw.json

          # Filter to runs created within the last 7 days
          jq --arg since "$SINCE" \
            '[.[] | select(.createdAt >= $since)]' \
            /tmp/runs_raw.json > /tmp/runs.json

          TOTAL_RUNS=$(jq length /tmp/runs.json)
          SUCCESS_RUNS=$(jq '[.[] | select(.conclusion=="success")] | length' /tmp/runs.json)
          FAILED_RUNS=$(jq '[.[] | select(.conclusion=="failure")] | length' /tmp/runs.json)

          # --- Collect Copilot PRs ---
          gh pr list \
            --repo "$REPO" \
            --state all \
            --limit 50 \
            --json number,title,state,createdAt,url,author \
            > /tmp/prs_raw.json 2>/dev/null || echo "[]" > /tmp/prs_raw.json

          # Filter by Copilot SWE agent login (login: "Copilot", app: copilot-swe-agent)
          jq --arg since "$SINCE" \
            '[.[] | select(.createdAt >= $since and (.author.login == "Copilot" or .author.login == "copilot-swe-agent"))]' \
            /tmp/prs_raw.json > /tmp/prs.json

          TOTAL_PRS=$(jq length /tmp/prs.json)
          MERGED_PRS=$(jq '[.[] | select(.state=="MERGED")] | length' /tmp/prs.json)
          OPEN_PRS=$(jq '[.[] | select(.state=="OPEN")] | length' /tmp/prs.json)

          # Build PR list
          jq -r '.[] | "- [#\(.number) \(.title | .[0:80])](\(.url)) — \(.state)"' \
            /tmp/prs.json | head -15 > /tmp/pr_list.txt
          [ -s /tmp/pr_list.txt ] || echo "- No agent PRs in the last 7 days" > /tmp/pr_list.txt

          # Build run list
          jq -r '.[] | "- [\(.displayTitle | .[0:70])](\(.url)) — \(.conclusion // .status)"' \
            /tmp/runs.json | head -15 > /tmp/run_list.txt
          [ -s /tmp/run_list.txt ] || echo "- No agent runs in the last 7 days" > /tmp/run_list.txt

          # --- Assemble report ---
          {
            echo "## 🦉 Agent Activity Report — Week of ${TODAY}"
            echo ""
            echo "> Auto-generated by the [Agent Activity Tracker](https://github.com/${REPO}/actions/workflows/agent-activity-tracker.yml) workflow."
            echo ""
            echo "### Summary"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Agent workflow runs (7 d) | ${TOTAL_RUNS} |"
            echo "| ✅ Successful runs | ${SUCCESS_RUNS} |"
            echo "| ❌ Failed runs | ${FAILED_RUNS} |"
            echo "| Agent PRs (7 d) | ${TOTAL_PRS} |"
            echo "| ↳ Merged | ${MERGED_PRS} |"
            echo "| ↳ Open | ${OPEN_PRS} |"
            echo ""
            echo "### Recent Agent PRs"
            echo ""
            cat /tmp/pr_list.txt
            echo ""
            echo "### Recent Agent Runs"
            echo ""
            cat /tmp/run_list.txt
            echo ""
            echo "---"
            echo "_Generated: $(date --utc) · Trigger: \`${{ github.event_name }}\`_"
          } > /tmp/report_body.md

          # --- Ensure label exists ---
          gh label create "agent-tracker" \
            --repo "$REPO" \
            --color "0075ca" \
            --description "Auto-generated agent activity report" 2>/dev/null || true

          # --- Create new issue (one per week) ---
          TITLE="🦉 Agent Activity Report — Week of ${TODAY}"
          gh issue create \
            --repo "$REPO" \
            --title "$TITLE" \
            --body-file /tmp/report_body.md \
            --label "agent-tracker"

          echo "Created agent activity report issue."
