name: Staging Security Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-staging-security:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture Datadog start time
        id: datadog_meta
        if: always() && secrets.DD_API_KEY != ''
        shell: bash
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run staging security validator
        id: validate
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          touch artifacts/staging-security-report.md artifacts/staging-security-console.log
          chmod +x bead-platform/scripts/validate-staging-security.sh

          EXPECTED_DOMAIN=bead-it.base44.app \
          REQUIRE_TLS_CERT_FILES=0 \
          REPORT_FILE=artifacts/staging-security-report.md \
          bead-platform/scripts/validate-staging-security.sh | tee artifacts/staging-security-console.log

          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-security-validation-${{ github.run_id }}
          path: |
            artifacts/staging-security-report.md
            artifacts/staging-security-console.log
          if-no-files-found: warn

      - name: Post report to protected Edge Function
        if: always() && secrets.STAGING_VALIDATION_EDGE_URL != '' && secrets.STAGING_VALIDATION_EDGE_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg pr "${{ github.event.pull_request.number }}" \
            --arg sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg report "$(cat artifacts/staging-security-report.md)" \
            '{repository:$repo,pull_request_number:$pr,sha:$sha,run_id:$run_id,run_url:$run_url,report:$report}')

          curl --fail --show-error --silent \
            -X POST "${{ secrets.STAGING_VALIDATION_EDGE_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.STAGING_VALIDATION_EDGE_TOKEN }}" \
            -d "${payload}" >/dev/null

      - name: Fail job on validator failure
        if: steps.validate.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Validator failed with exit code ${{ steps.validate.outputs.exit_code }}"
          exit 1

      - name: Send Datadog CI metrics
        if: always() && secrets.DD_API_KEY != ''
        shell: bash
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: ${{ vars.DD_SITE }}
          DD_ENV: ${{ vars.DD_ENV }}
          DD_SERVICE: ${{ vars.DD_SERVICE }}
          DD_EXTRA_TAGS: ${{ vars.DD_EXTRA_TAGS }}
          DD_JOB_STATUS: ${{ job.status }}
          DD_PIPELINE_TYPE: ci
        run: |
          set -uo pipefail
          site="${DD_SITE:-datadoghq.com}"
          env_name="${DD_ENV:-ci}"
          service="${DD_SERVICE:-owleyes-github-actions}"
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          started="${{ steps.datadog_meta.outputs.start_epoch }}"
          now=$(date +%s)
          duration=0
          if [[ -n "$started" ]]; then
            duration=$((now - started))
          fi
          tags="repo:${GITHUB_REPOSITORY},workflow:${GITHUB_WORKFLOW},job:${GITHUB_JOB},branch:${branch},event:${GITHUB_EVENT_NAME},status:${DD_JOB_STATUS},env:${env_name},service:${service},pipeline_type:${DD_PIPELINE_TYPE},provider:github,runner:github-actions"
          if [[ -n "${DD_EXTRA_TAGS:-}" ]]; then
            tags="${tags},${DD_EXTRA_TAGS}"
          fi
          payload=$(jq -n \
            --argjson now "$now" \
            --argjson duration "$duration" \
            --arg tags "$tags" \
            '{series: [
              {metric: "owleyes.github_actions.job.duration_seconds", points: [[$now, $duration]], type: "gauge", tags: ($tags | split(","))},
              {metric: "owleyes.github_actions.job.completed", points: [[$now, 1]], type: "count", tags: ($tags | split(","))}
            ]}')
          curl --silent --show-error --fail \
            -X POST "https://api.${site}/api/v1/series" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${DD_API_KEY}" \
            -d "$payload" >/dev/null \
            || echo "::warning::Failed to send Datadog metrics for ${GITHUB_JOB}"
