name: System Monitor

on:
  schedule:
    - cron: '0 8 * * *' # Daily at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read
  security-events: read

jobs:
  system-health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Collect system health metrics
        id: health
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TODAY=$(date --utc +%Y-%m-%d)
          SINCE_24H=$(date -d '24 hours ago' --utc +%Y-%m-%dT%H:%M:%SZ)
          SINCE_7D=$(date -d '7 days ago' --utc +%Y-%m-%dT%H:%M:%SZ)

          # --- Workflow health (last 24 h) ---
          gh run list \
            --repo "$REPO" \
            --limit 30 \
            --json databaseId,name,status,conclusion,createdAt,url \
            > /tmp/all_runs_raw.json 2>/dev/null || echo "[]" > /tmp/all_runs_raw.json

          jq --arg since "$SINCE_24H" \
            '[.[] | select(.createdAt >= $since)]' \
            /tmp/all_runs_raw.json > /tmp/all_runs.json

          TOTAL_RUNS=$(jq length /tmp/all_runs.json)
          FAILED_RUNS=$(jq '[.[] | select(.conclusion=="failure")] | length' /tmp/all_runs.json)
          SUCCESS_RUNS=$(jq '[.[] | select(.conclusion=="success")] | length' /tmp/all_runs.json)
          IN_PROGRESS=$(jq '[.[] | select(.status=="in_progress")] | length' /tmp/all_runs.json)

          # Failed run details
          jq -r '.[] | select(.conclusion=="failure") | "- [\(.name)](\(.url)) — failed at \(.createdAt)"' \
            /tmp/all_runs.json | head -10 > /tmp/failed_runs.txt
          [ -s /tmp/failed_runs.txt ] || echo "- No failed runs in the last 24 hours" > /tmp/failed_runs.txt

          # Determine health status
          if [ "$FAILED_RUNS" -gt 2 ]; then
            HEALTH_EMOJI="🔴"
            HEALTH_STATUS="Critical"
          elif [ "$FAILED_RUNS" -gt 0 ]; then
            HEALTH_EMOJI="🟡"
            HEALTH_STATUS="Degraded"
          else
            HEALTH_EMOJI="🟢"
            HEALTH_STATUS="Healthy"
          fi

          # --- Open issues & PRs ---
          OPEN_ISSUES=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --json number \
            --limit 100 2>/dev/null | jq length || echo 0)

          OPEN_PRS=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --json number \
            --limit 100 2>/dev/null | jq length || echo 0)

          # Stale PRs (open > 7 days)
          gh pr list \
            --repo "$REPO" \
            --state open \
            --limit 50 \
            --json number,title,url,createdAt \
            > /tmp/open_prs.json 2>/dev/null || echo "[]" > /tmp/open_prs.json

          jq --arg since "$SINCE_7D" \
            '[.[] | select(.createdAt < $since)]' \
            /tmp/open_prs.json > /tmp/stale_prs.json
          STALE_PRS=$(jq length /tmp/stale_prs.json)

          jq -r '.[] | "- [#\(.number) \(.title | .[0:70])](\(.url)) (open since \(.createdAt | .[0:10]))"' \
            /tmp/stale_prs.json | head -5 > /tmp/stale_pr_list.txt
          [ -s /tmp/stale_pr_list.txt ] || echo "- No stale PRs" > /tmp/stale_pr_list.txt

          # --- Code scanning alerts ---
          CODE_ALERTS=$(gh api \
            "repos/${REPO}/code-scanning/alerts?state=open&per_page=100" \
            --jq 'length' 2>/dev/null || echo "N/A")

          # --- Secret scanning alerts ---
          SECRET_ALERTS=$(gh api \
            "repos/${REPO}/secret-scanning/alerts?state=open&per_page=100" \
            --jq 'length' 2>/dev/null || echo "N/A")

          # --- Assemble report ---
          {
            echo "## ${HEALTH_EMOJI} System Health Report — ${TODAY}"
            echo ""
            echo "> Auto-generated by the [System Monitor](https://github.com/${REPO}/actions/workflows/system-monitor.yml) workflow."
            echo ""
            echo "### Overall Status: **${HEALTH_STATUS}**"
            echo ""
            echo "### Workflow Health (last 24 h)"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Total runs | ${TOTAL_RUNS} |"
            echo "| ✅ Successful | ${SUCCESS_RUNS} |"
            echo "| ❌ Failed | ${FAILED_RUNS} |"
            echo "| 🔄 In progress | ${IN_PROGRESS} |"
            echo ""
            if [ "$FAILED_RUNS" -gt 0 ]; then
              echo "#### Failed Runs"
              echo ""
              cat /tmp/failed_runs.txt
              echo ""
            fi
            echo "### Repository Status"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Open issues | ${OPEN_ISSUES} |"
            echo "| Open PRs | ${OPEN_PRS} |"
            echo "| Stale PRs (>7 d) | ${STALE_PRS} |"
            echo "| Code scanning alerts | ${CODE_ALERTS} |"
            echo "| Secret scanning alerts | ${SECRET_ALERTS} |"
            echo ""
            if [ "$STALE_PRS" -gt 0 ]; then
              echo "#### Stale Pull Requests"
              echo ""
              cat /tmp/stale_pr_list.txt
              echo ""
            fi
            echo "---"
            echo "_Generated: $(date --utc) · Trigger: \`${{ github.event_name }}\`_"
          } > /tmp/health_report.md

          echo "health_status=$HEALTH_STATUS" >> "$GITHUB_OUTPUT"
          echo "failed_runs=$FAILED_RUNS" >> "$GITHUB_OUTPUT"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "health_emoji=$HEALTH_EMOJI" >> "$GITHUB_OUTPUT"

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "system-monitor" \
            --repo "$REPO" \
            --color "e4e669" \
            --description "Auto-generated system health report" 2>/dev/null || true

          gh label create "risk" \
            --repo "$REPO" \
            --color "d93f0b" \
            --description "Risk or issue requiring attention" 2>/dev/null || true

      - name: Create system health issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TODAY: ${{ steps.health.outputs.today }}
          HEALTH_EMOJI: ${{ steps.health.outputs.health_emoji }}
          HEALTH_STATUS: ${{ steps.health.outputs.health_status }}
          FAILED_RUNS: ${{ steps.health.outputs.failed_runs }}
        run: |
          TITLE="${HEALTH_EMOJI} System Health Report — ${TODAY}"
          LABELS="system-monitor"

          # Add risk label when health is degraded or critical
          if [ "$HEALTH_STATUS" != "Healthy" ]; then
            LABELS="system-monitor,risk"
          fi

          # Close any existing open system-monitor issues for today to avoid duplicates
          EXISTING_ISSUES=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --label "system-monitor" \
            --search "System Health Report — ${TODAY} in:title" \
            --json number \
            --jq '.[].number' 2>/dev/null) || EXISTING_ISSUES=""

          if [ -n "$EXISTING_ISSUES" ]; then
            echo "Found existing system-monitor issue(s) for today. Closing to avoid duplicates."
            while IFS= read -r num; do
              echo "Closing issue #${num}"
              gh issue close "$num" --repo "$REPO" \
                --comment "Superseded by a new report for the same day." 2>/dev/null \
                || echo "::warning::Failed to close issue #${num} — it will remain open alongside the new report."
            done <<< "$EXISTING_ISSUES"
          fi

          gh issue create \
            --repo "$REPO" \
            --title "$TITLE" \
            --body-file /tmp/health_report.md \
            --label "$LABELS"

          echo "Created system health report issue."
