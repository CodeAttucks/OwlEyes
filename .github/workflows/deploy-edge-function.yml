name: Deploy Edge Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: vqawanftlolsplxuwipw
  NEXT_PUBLIC_SUPABASE_URL: https://vqawanftlolsplxuwipw.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_KCIF4MY_KWhI947PtnAPYg__AXV6tYa

concurrency:
  group: deploy-edge-function-main
  cancel-in-progress: false

jobs:
  smoke-check:
    name: Pre-deploy smoke check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run staging security validator
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bead-platform/scripts/validate-staging-security.sh
          EXPECTED_DOMAIN=bead-it.base44.app \
          REQUIRE_TLS_CERT_FILES=0 \
          bead-platform/scripts/validate-staging-security.sh

  deploy:
    name: Deploy staging-validation-report
    needs: smoke-check
    runs-on: ubuntu-latest
    # Only deploy from the main branch; skip on PR branches even if workflow is evaluated there
    if: github.ref == 'refs/heads/main'
    environment:
      name: supabase-production
      url: ${{ secrets.STAGING_VALIDATION_EDGE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deploy secrets are configured
        id: check_secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" && \
                -n "${{ secrets.SUPABASE_PROJECT_REF }}" && \
                -n "${{ secrets.EDGE_FUNCTION_TOKEN }}" && \
                -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" && \
                -n "${{ secrets.SUPABASE_DB_PASSWORD }}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::One or more Supabase deployment secrets are not configured. Skipping edge function deployment. See GITHUB_SECRETS_SETUP.md for setup instructions."
          fi

      - name: Push function secrets
        if: steps.check_secrets.outputs.configured == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          EDGE_FUNCTION_TOKEN: ${{ secrets.EDGE_FUNCTION_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          supabase secrets set \
            EDGE_FUNCTION_TOKEN="${EDGE_FUNCTION_TOKEN}" \
            SUPABASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co" \
            SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY}" \
            --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Deploy Edge Function
        if: steps.check_secrets.outputs.configured == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy staging-validation-report \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt

      - name: Link Supabase project
        if: steps.check_secrets.outputs.configured == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: vqawanftlolsplxuwipw
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        if: steps.check_secrets.outputs.configured == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: vqawanftlolsplxuwipw
        run: |
          set -euo pipefail
          supabase db push
