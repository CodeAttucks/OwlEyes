name: Deploy Edge Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-edge-function-main
  cancel-in-progress: false

jobs:
  smoke-check:
    name: Pre-deploy smoke check
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture Datadog start time
        id: datadog_meta
        if: always() && secrets.DD_API_KEY != ''
        shell: bash
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run staging security validator
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bead-platform/scripts/validate-staging-security.sh
          EXPECTED_DOMAIN=bead-it.base44.app \
          REQUIRE_TLS_CERT_FILES=0 \
          bead-platform/scripts/validate-staging-security.sh

      - name: Send Datadog deploy metrics
        if: always() && secrets.DD_API_KEY != ''
        shell: bash
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: ${{ vars.DD_SITE }}
          DD_ENV: ${{ vars.DD_ENV }}
          DD_SERVICE: ${{ vars.DD_SERVICE }}
          DD_EXTRA_TAGS: ${{ vars.DD_EXTRA_TAGS }}
          DD_JOB_STATUS: ${{ job.status }}
          DD_PIPELINE_TYPE: deploy
        run: |
          set -uo pipefail
          site="${DD_SITE:-datadoghq.com}"
          env_name="${DD_ENV:-ci}"
          service="${DD_SERVICE:-owleyes-github-actions}"
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          started="${{ steps.datadog_meta.outputs.start_epoch }}"
          now=$(date +%s)
          duration=0
          if [[ -n "$started" ]]; then
            duration=$((now - started))
          fi
          tags="repo:${GITHUB_REPOSITORY},workflow:${GITHUB_WORKFLOW},job:${GITHUB_JOB},branch:${branch},event:${GITHUB_EVENT_NAME},status:${DD_JOB_STATUS},env:${env_name},service:${service},pipeline_type:${DD_PIPELINE_TYPE},provider:github,runner:github-actions"
          if [[ -n "${DD_EXTRA_TAGS:-}" ]]; then
            tags="${tags},${DD_EXTRA_TAGS}"
          fi
          payload=$(jq -n \
            --argjson now "$now" \
            --argjson duration "$duration" \
            --arg tags "$tags" \
            '{series: [
              {metric: "owleyes.github_actions.job.duration_seconds", points: [[$now, $duration]], type: "gauge", tags: ($tags | split(","))},
              {metric: "owleyes.github_actions.job.completed", points: [[$now, 1]], type: "count", tags: ($tags | split(","))}
            ]}')
          curl --silent --show-error --fail \
            -X POST "https://api.${site}/api/v1/series" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${DD_API_KEY}" \
            -d "$payload" >/dev/null \
            || echo "::warning::Failed to send Datadog metrics for ${GITHUB_JOB}"

  pre-check:
    name: Check deployment secrets
    runs-on: ubuntu-latest

    outputs:
      configured: ${{ steps.check_secrets.outputs.configured }}

    steps:
      - name: Check deploy secrets are configured
        id: check_secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" && \
                -n "${{ secrets.SUPABASE_PROJECT_REF }}" && \
                -n "${{ secrets.EDGE_FUNCTION_TOKEN }}" && \
                -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" && \
                -n "${{ secrets.SUPABASE_DB_PASSWORD }}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::One or more Supabase deployment secrets are not configured. Skipping edge function deployment. See GITHUB_SECRETS_SETUP.md for setup instructions."
          fi

      - name: Send Datadog deploy metrics
        if: always() && secrets.DD_API_KEY != ''
        shell: bash
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: ${{ vars.DD_SITE }}
          DD_ENV: ${{ vars.DD_ENV }}
          DD_SERVICE: ${{ vars.DD_SERVICE }}
          DD_EXTRA_TAGS: ${{ vars.DD_EXTRA_TAGS }}
          DD_JOB_STATUS: ${{ job.status }}
          DD_PIPELINE_TYPE: deploy
        run: |
          set -uo pipefail
          site="${DD_SITE:-datadoghq.com}"
          env_name="${DD_ENV:-ci}"
          service="${DD_SERVICE:-owleyes-github-actions}"
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          now=$(date +%s)
          tags="repo:${GITHUB_REPOSITORY},workflow:${GITHUB_WORKFLOW},job:${GITHUB_JOB},branch:${branch},event:${GITHUB_EVENT_NAME},status:${DD_JOB_STATUS},env:${env_name},service:${service},pipeline_type:${DD_PIPELINE_TYPE},provider:github,runner:github-actions"
          if [[ -n "${DD_EXTRA_TAGS:-}" ]]; then
            tags="${tags},${DD_EXTRA_TAGS}"
          fi
          payload=$(jq -n \
            --argjson now "$now" \
            --arg tags "$tags" \
            '{series: [
              {metric: "owleyes.github_actions.job.completed", points: [[$now, 1]], type: "count", tags: ($tags | split(","))}
            ]}')
          curl --silent --show-error --fail \
            -X POST "https://api.${site}/api/v1/series" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${DD_API_KEY}" \
            -d "$payload" >/dev/null \
            || echo "::warning::Failed to send Datadog metrics for ${GITHUB_JOB}"

  deploy:
    name: Deploy staging-validation-report
    needs: [smoke-check, pre-check]
    runs-on: ubuntu-latest
    # Only deploy from the main branch when secrets are fully configured
    if: github.ref == 'refs/heads/main' && needs.pre-check.outputs.configured == 'true'
    environment:
      name: supabase-production
      url: ${{ secrets.STAGING_VALIDATION_EDGE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture Datadog start time
        id: datadog_meta
        if: always() && secrets.DD_API_KEY != ''
        shell: bash
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push function secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          EDGE_FUNCTION_TOKEN: ${{ secrets.EDGE_FUNCTION_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          supabase secrets set \
            EDGE_FUNCTION_TOKEN="${EDGE_FUNCTION_TOKEN}" \
            SUPABASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co" \
            SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY}" \
            --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Deploy Edge Function
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy staging-validation-report \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt

      - name: Link Supabase project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: vqawanftlolsplxuwipw
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: vqawanftlolsplxuwipw
        run: |
          set -euo pipefail
          supabase db push

      - name: Send Datadog deploy metrics
        if: always() && secrets.DD_API_KEY != ''
        shell: bash
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: ${{ vars.DD_SITE }}
          DD_ENV: ${{ vars.DD_ENV }}
          DD_SERVICE: ${{ vars.DD_SERVICE }}
          DD_EXTRA_TAGS: ${{ vars.DD_EXTRA_TAGS }}
          DD_JOB_STATUS: ${{ job.status }}
          DD_PIPELINE_TYPE: deploy
        run: |
          set -uo pipefail
          site="${DD_SITE:-datadoghq.com}"
          env_name="${DD_ENV:-ci}"
          service="${DD_SERVICE:-owleyes-github-actions}"
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          started="${{ steps.datadog_meta.outputs.start_epoch }}"
          now=$(date +%s)
          duration=0
          if [[ -n "$started" ]]; then
            duration=$((now - started))
          fi
          tags="repo:${GITHUB_REPOSITORY},workflow:${GITHUB_WORKFLOW},job:${GITHUB_JOB},branch:${branch},event:${GITHUB_EVENT_NAME},status:${DD_JOB_STATUS},env:${env_name},service:${service},pipeline_type:${DD_PIPELINE_TYPE},provider:github,runner:github-actions"
          if [[ -n "${DD_EXTRA_TAGS:-}" ]]; then
            tags="${tags},${DD_EXTRA_TAGS}"
          fi
          payload=$(jq -n \
            --argjson now "$now" \
            --argjson duration "$duration" \
            --arg tags "$tags" \
            '{series: [
              {metric: "owleyes.github_actions.job.duration_seconds", points: [[$now, $duration]], type: "gauge", tags: ($tags | split(","))},
              {metric: "owleyes.github_actions.job.completed", points: [[$now, 1]], type: "count", tags: ($tags | split(","))}
            ]}')
          curl --silent --show-error --fail \
            -X POST "https://api.${site}/api/v1/series" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${DD_API_KEY}" \
            -d "$payload" >/dev/null \
            || echo "::warning::Failed to send Datadog metrics for ${GITHUB_JOB}"
