name: Deploy Edge Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-edge-function-main
  cancel-in-progress: false

jobs:
  deploy-staging-validation-edge-function:
    name: Deploy staging-validation-report
    runs-on: ubuntu-latest
    environment:
      name: supabase-production
      url: ${{ secrets.STAGING_VALIDATION_EDGE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-deploy smoke check (merge commit)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bead-platform/scripts/validate-staging-security.sh
          EXPECTED_DOMAIN=bead-it.base44.app \
          REQUIRE_TLS_CERT_FILES=0 \
          bead-platform/scripts/validate-staging-security.sh

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          test -n "${{ secrets.SUPABASE_PROJECT_REF }}"
          test -n "${{ secrets.EDGE_FUNCTION_TOKEN }}"
          test -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

      - name: Push function secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          EDGE_FUNCTION_TOKEN: ${{ secrets.EDGE_FUNCTION_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          supabase secrets set \
            EDGE_FUNCTION_TOKEN="${EDGE_FUNCTION_TOKEN}" \
            SUPABASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co" \
            SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY}" \
            --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Deploy Edge Function
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy staging-validation-report \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt
