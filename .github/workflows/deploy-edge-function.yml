name: Deploy Edge Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-edge-function-main
  cancel-in-progress: false

jobs:
  smoke-check:
    name: Pre-deploy smoke check
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run staging security validator
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bead-platform/scripts/validate-staging-security.sh
          EXPECTED_DOMAIN=bead-it.base44.app \
          REQUIRE_TLS_CERT_FILES=0 \
          bead-platform/scripts/validate-staging-security.sh

  pre-check:
    name: Check deployment secrets
    runs-on: ubuntu-latest

    outputs:
      configured: ${{ steps.check_secrets.outputs.configured }}

    steps:
      - name: Check deploy secrets are configured
        id: check_secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" && \
                -n "${{ secrets.SUPABASE_PROJECT_REF }}" && \
                -n "${{ secrets.EDGE_FUNCTION_TOKEN }}" && \
                -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" && \
                -n "${{ secrets.SUPABASE_DB_PASSWORD }}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::One or more Supabase deployment secrets are not configured. Skipping edge function deployment. See GITHUB_SECRETS_SETUP.md for setup instructions."
          fi

  deploy:
    name: Deploy staging-validation-report
    needs: [smoke-check, pre-check]
    runs-on: ubuntu-latest
    # Only deploy from the main branch when secrets are fully configured
    if: github.ref == 'refs/heads/main' && needs.pre-check.outputs.configured == 'true'
    environment:
      name: supabase-production
      url: ${{ secrets.STAGING_VALIDATION_EDGE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push function secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          EDGE_FUNCTION_TOKEN: ${{ secrets.EDGE_FUNCTION_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          supabase secrets set \
            EDGE_FUNCTION_TOKEN="${EDGE_FUNCTION_TOKEN}" \
            SUPABASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co" \
            SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY}" \
            --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Deploy Edge Function
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy staging-validation-report \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt

      - name: Link Supabase project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: vqawanftlolsplxuwipw
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: vqawanftlolsplxuwipw
        run: |
          set -euo pipefail
          supabase db push
